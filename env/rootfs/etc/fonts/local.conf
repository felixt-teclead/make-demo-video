<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- vc-v1 (C-15): Noto core + Noto Color Emoji only. Other installed families are rejected so no fallback font appears. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/dejavu/*</glob>
      <glob>/usr/share/fonts/truetype/liberation/*</glob>
      <glob>/usr/share/fonts/truetype/liberation2/*</glob>
      <glob>/usr/share/fonts/X11/*</glob>
    </rejectfont>
  </selectfont>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Noto Sans</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Noto Serif</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Noto Sans Mono</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <match target="pattern"><test name="family" compare="not_eq"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit></match>
  <match target="font"><edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit><edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit></match>
</fontconfig>
