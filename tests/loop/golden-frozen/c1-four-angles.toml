# Golden case 1 (acceptance/cases.md): "One process, four angles" (click-around, read-only).
# Controls, routes and texts marked UNVERIFIED come from the brief, not from exploration; D-10/D-11 exploration
# with jev must confirm or replace them before approval (the validator refuses a control it cannot resolve).
format = "vc-spec/1"
name = "c1-four-angles"
title = "Ein Prozess, vier Blickwinkel"
purpose = "Show that a documented process reads three ways (swimlanes, BPMN, RACI) and that each step and the whole process carry details, in a few clicks."
context = "This is an intended click-through of one documented process; nothing is created, changed or shared (read-only)."
length = [30, 60]
deny = []
site_switches = []
writes = []

[params]
start_url = "https://app.example.com/prozesse"   # UNVERIFIED route of the process list
process = "Urlaubsantrag"
first_step = "Urlaubsantrag stellen"
step_count = "5"
frequency = "ca. 40 Anträge im Monat"

[start]
url = "{start_url}"
ready = [{ type = "text_visible", value = "Meine" }, { type = "text_visible", value = "{process}" }]
warm = []
hold = 1.2

[[preconditions]]
what = "The process list 'Meine' shows the list layout (rows), not the card layout."
by = "human"
check = [{ type = "element_visible", role = "row", label_contains = "{process}" }]

[[preconditions]]
what = "'{process}' is the first row under 'Meine' and is visible without scrolling."
by = "human"

[privacy]
account = "the owner's own account in the app (OD-05)"
shown = "sidebar chat titles under 'Bisherige Chats', the owner's full name and organisation"
why_ok = "the owner accepted these (OD-05, no blur in v1); colleague names stay off screen because 'Zusammenarbeit' and the 'Organisation' tab are on the profile's deny list"

[[steps]]
name = "open-process"
does = 'click the row "Urlaubsantrag" in the process list'
hold = 2.0
expect = [{ type = "text_visible", value = "{first_step}" }, { type = "text_visible", value = "Swimlanes" }]
  [[steps.actions]]
  op = "click"
  control = { label = "{process}", within = "row" }
  where = "the first row under 'Meine' in the process list"

[[steps]]
name = "bpmn"
does = 'click the view button "BPMN"'
hold = 2.5
expect = [{ type = "text_visible", value = "BPMN exportieren" }]
  [[steps.actions]]
  op = "click"
  control = { label = "BPMN" }
  where = "the view switch above the diagram"

[[steps]]
name = "raci"
does = 'click the view button "RACI"'
hold = 3.0
hold_kind = "reading"
expect = [{ type = "text_visible", value = "Legende:" }, { type = "text_visible", value = "{first_step}" }]
  [[steps.actions]]
  op = "click"
  control = { label = "RACI" }
  where = "the view switch above the diagram"

[[steps]]
name = "swimlanes"
does = 'click the view button "Swimlanes"'
hold = 1.2
expect = [{ type = "text_absent", value = "Legende:" }, { type = "text_absent", value = "BPMN exportieren" }]
  [[steps.actions]]
  op = "click"
  control = { label = "Swimlanes" }
  where = "the view switch above the diagram"

[[steps]]
name = "step-dialog"
does = 'click the step card "Urlaubsantrag stellen", read its dialog, close it with ×'
hold = 1.0
expect = [{ type = "dialog_closed" }, { type = "text_visible", value = "{first_step}" }]
  [[steps.actions]]
  op = "click"
  control = { label_contains = "{first_step}", within = "diagram" }
  where = "the first step card in the swimlane diagram"
  done = [{ type = "dialog_open", value = "{first_step}" }, { type = "text_visible", value = "SCHRITT 1 VON {step_count}" }]
  hold = 3.0
  hold_kind = "dialog"
  [[steps.actions]]
  op = "click"
  control = { label = "Schließen", within = "dialog" }   # UNVERIFIED accessible name of the × button
  where = "the close (×) button inside the open step dialog"
  done = [{ type = "dialog_closed" }]

[[steps]]
name = "details"
does = 'click the tab "Details"'
hold = 3.0
hold_kind = "reading"
expect = [{ type = "text_visible", value = "Probleme & Schmerzpunkte" }]
  [[steps.actions]]
  op = "click"
  control = { label = "Details", role = "tab" }
  where = "the tab row of the process"

[[steps]]
name = "metadaten"
does = 'click the tab "Metadaten"'
hold = 12.0
hold_kind = "final"
expect = [{ type = "text_visible", value = "{frequency}" }]
  [[steps.actions]]
  op = "click"
  control = { label = "Metadaten", role = "tab" }
  where = "the tab row of the process"

[knobs]

[approval]
approver = ""
approved_at = ""
fingerprint = ""
writes = []
